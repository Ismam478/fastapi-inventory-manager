<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Nexora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg: #0b0b12;
            --bg2: #13131c;
            --bg3: #1b1b27;
            --card: #18182a;
            --border: rgba(255,255,255,0.07);
            --primary: #7c3aed;
            --primary-l: #9d5cf7;
            --accent: #06d6a0;
            --text: #f0f0f5;
            --muted: #7a7a88;
            --radius: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        html { scroll-behavior: smooth; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.02'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
            opacity: 0.4;
        }

        .bg-decoration {
            position: fixed;
            inset: 0;
            z-index: -1;
            overflow: hidden;
        }

        .decoration-circle {
            position: absolute;
            border-radius: 50%;
            opacity: 0.08;
            pointer-events: none;
        }

        .decoration-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--primary), transparent);
            top: -100px;
            right: -100px;
        }

        .decoration-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, var(--accent), transparent);
            bottom: -50px;
            left: -50px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
            animation: fadeUp 0.6s ease both;
        }

        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--primary);
            display: inline-block;
            margin-bottom: 24px;
            cursor: pointer;
            transition: color var(--transition);
        }

        .logo:hover { color: var(--primary-l); }

        .header-title {
            font-family: 'Playfair Display', serif;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .header-subtitle {
            font-size: 14px;
            color: var(--muted);
            font-weight: 300;
        }

        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 40px;
            backdrop-filter: blur(20px);
            animation: fadeUp 0.6s 0.1s ease both;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(24px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 24px;
            animation: fadeUp 0.6s ease both;
        }

        .form-group:nth-child(2) { animation-delay: 0.15s; }
        .form-group:nth-child(3) { animation-delay: 0.2s; }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: border-color var(--transition), box-shadow var(--transition);
            outline: none;
        }

        .form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.1);
        }

        .form-input::placeholder { color: #5a5a68; }

        .form-messages {
            margin-top: 16px;
        }

        .form-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            color: #fca5a5;
            display: none;
        }

        .form-error.show { display: block; }

        .form-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            padding: 12px;
            font-size: 13px;
            color: #86efac;
            display: none;
        }

        .form-success.show { display: block; }

        .submit-btn {
            width: 100%;
            padding: 14px 24px;
            background: linear-gradient(135deg, var(--primary), var(--primary-l));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            animation: fadeUp 0.6s 0.25s ease both;
        }

        .submit-btn:hover:not(:disabled) {
            background: linear-gradient(135deg, var(--primary-l), var(--primary));
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(124, 58, 237, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .footer-link {
            text-align: center;
            margin-top: 24px;
            font-size: 13px;
            color: var(--muted);
            animation: fadeUp 0.6s 0.3s ease both;
        }

        .footer-link a {
            color: var(--primary);
            text-decoration: none;
            transition: color var(--transition);
        }

        .footer-link a:hover { color: var(--primary-l); }

        .profile-actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 24px;
            animation: fadeUp 0.6s 0.25s ease both;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-l));
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(124, 58, 237, 0.4);
        }

        .btn-secondary {
            background: var(--bg3);
            color: var(--muted);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        @media (max-width: 640px) {
            body { padding: 16px; align-items: flex-start; padding-top: 32px; }
            .form-card { padding: 32px 24px; }
            .header { margin-bottom: 32px; }
            .header-title { font-size: 28px; }
        }
    </style>
</head>
<body>

    <div class="bg-decoration">
        <div class="decoration-circle decoration-1"></div>
        <div class="decoration-circle decoration-2"></div>
    </div>

    <div class="container">
        <div class="header">
            <div class="logo">Nexora</div>
            <h1 class="header-title">Welcome Back</h1>
            <p class="header-subtitle">Sign in to your admin account</p>
        </div>

        <div class="form-card">
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        required
                        class="form-input"
                        placeholder="Enter your username"
                    >
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        required
                        class="form-input"
                        placeholder="Enter your password"
                    >
                </div>

                <div class="form-messages">
                    <div id="errorMessage" class="form-error"></div>
                    <div id="successMessage" class="form-success"></div>
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">Sign In</button>
            </form>

            <div id="signupLink" class="footer-link">
                Don't have an account? <a href="/signup">Sign up here</a>
            </div>

            <div id="profileSection" class="profile-actions" style="display: none;">
                <button onclick="goToAdmin()" class="btn btn-primary">Go to Dashboard</button>
                <button onclick="handleLogout()" class="btn btn-secondary">Logout</button>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
</body>
</html>
