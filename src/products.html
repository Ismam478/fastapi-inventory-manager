<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products - Nexora</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        
        :root {
            --bg: #0b0b12;
            --bg2: #13131c;
            --bg3: #1b1b27;
            --card: #18182a;
            --border: rgba(255,255,255,0.07);
            --primary: #7c3aed;
            --primary-l: #9d5cf7;
            --accent: #06d6a0;
            --text: #f0f0f5;
            --muted: #7a7a88;
        }
        
        html { scroll-behavior: smooth; }
        
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.02'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 9999;
            opacity: 0.4;
        }

        /* Navigation */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 60px;
            height: 72px;
            background: rgba(15,15,19,0.85);
            backdrop-filter: blur(25px);
            border-bottom: 1px solid var(--border);
            transition: var(--transition);
        }

        .nav-logo {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--primary);
            text-decoration: none;
            cursor: pointer;
        }

        .nav-logo:hover {
            color: var(--primary-l);
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 40px;
        }

        .nav-links a {
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.5px;
            color: var(--muted);
            text-decoration: none;
            cursor: pointer;
            transition: color var(--transition);
            text-transform: uppercase;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--primary-l);
        }

        .nav-cta {
            background: var(--primary);
            color: white !important;
            padding: 10px 24px;
            border-radius: var(--radius-sm);
            font-weight: 600 !important;
            text-transform: none !important;
        }

        .nav-cta:hover {
            background: var(--primary-l);
            box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
        }

        /* Main Content */
        .main-container {
            padding-top: 72px;
            min-height: 100vh;
            background: var(--bg);
        }

        .content {
            padding: 60px 80px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            margin-bottom: 60px;
        }

        .header-title {
            font-family: 'Playfair Display', serif;
            font-size: 56px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 16px;
        }

        .header-subtitle {
            font-size: 18px;
            color: var(--muted);
            font-weight: 300;
        }

        /* Filters */
        .filters {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            padding: 24px;
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0 16px;
            transition: border-color var(--transition);
        }

        .search-box:focus-within {
            border-color: var(--primary);
        }

        .search-box input {
            background: none;
            border: none;
            outline: none;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            color: var(--text);
            padding: 12px 0;
            width: 100%;
        }

        .search-box input::placeholder {
            color: var(--muted-2);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .filter-label {
            font-size: 12px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }

        .filter-input {
            padding: 8px 12px;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            outline: none;
            transition: border-color var(--transition);
        }

        .filter-input:focus {
            border-color: var(--primary);
        }

        .btn-filter {
            padding: 8px 16px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-filter:hover {
            background: var(--primary-l);
        }

        .btn-reset {
            padding: 8px 16px;
            background: transparent;
            color: var(--muted);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-reset:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        /* Products Grid */
        .products-section {
            margin-bottom: 60px;
        }

        .products-count {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 28px;
        }

        .product-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .product-card:hover {
            transform: translateY(-8px);
            border-color: var(--primary);
            box-shadow: 0 24px 60px rgba(37, 99, 235, 0.2);
        }

        .product-image {
            width: 100%;
            height: 220px;
            background: linear-gradient(135deg, var(--bg3), var(--bg2));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
            color: var(--muted-2);
            position: relative;
            overflow: hidden;
        }

        .product-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, rgba(37, 99, 235, 0.1), transparent);
            opacity: 0;
            transition: opacity var(--transition);
        }

        .product-card:hover .product-image::after { opacity: 1; }

        .product-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 2;
            padding: 6px 12px;
            border-radius: 100px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: rgba(37, 99, 235, 0.2);
            color: var(--primary-l);
            border: 1px solid rgba(37, 99, 235, 0.4);
        }

        .product-stock-badge {
            position: absolute;
            bottom: 12px;
            left: 12px;
            z-index: 2;
            padding: 4px 10px;
            border-radius: 100px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: rgba(16, 185, 129, 0.2);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.4);
        }

        .product-stock-badge.low {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            border-color: rgba(245, 158, 11, 0.4);
        }

        .product-stock-badge.out {
            background: rgba(239, 68, 68, 0.2);
            color: var(--danger);
            border-color: rgba(239, 68, 68, 0.4);
        }

        .product-content {
            padding: 24px;
        }

        .product-category {
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--primary);
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .product-name {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .product-desc {
            font-size: 13px;
            color: var(--muted);
            line-height: 1.6;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-top: 1px solid var(--border);
            padding-top: 16px;
            gap: 12px;
        }

        .product-price {
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            letter-spacing: 0.5px;
            color: var(--primary);
            font-weight: 700;
        }

        .product-quantity {
            font-size: 12px;
            color: var(--muted);
        }

        .product-quantity b {
            color: var(--text);
            font-weight: 600;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1/-1;
            text-align: center;
            padding: 80px 20px;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }

        .empty-state-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text);
        }

        .empty-state-text {
            font-size: 15px;
            color: var(--muted);
        }

        /* Footer */
        footer {
            background: var(--bg2);
            border-top: 1px solid var(--border);
            padding: 40px 80px;
            text-align: center;
        }

        .footer-text {
            font-size: 13px;
            color: var(--muted);
        }

        /* Loading */
        .skeleton {
            background: linear-gradient(90deg, var(--bg3) 25%, var(--bg2) 50%, var(--bg3) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 4px;
        }

        @keyframes shimmer {
            from { background-position: 200% 0; }
            to { background-position: -200% 0; }
        }

        .skeleton-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            height: 400px;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            z-index: 9000;
            padding: 16px 24px;
            border-radius: var(--radius-sm);
            background: var(--primary);
            border: 1px solid rgba(37, 99, 235, 0.5);
            color: white;
            font-size: 14px;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 12px 32px rgba(37, 99, 235, 0.3);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            nav { padding: 0 40px; }
            .content { padding: 60px 40px; }
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
            .filters { flex-direction: column; align-items: flex-start; }
            .search-box { flex: none; width: 100%; }
        }

        @media (max-width: 640px) {
            nav { padding: 0 20px; height: 64px; }
            .nav-logo { font-size: 20px; }
            .nav-links { display: none; }
            .content { padding: 40px 20px; }
            .header-title { font-size: 32px; }
            .products-grid { grid-template-columns: 1fr; }
            footer { padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <a class="nav-logo" href="/home" style="font-size: 44px;">Nexora</a>
        <div class="nav-links">
            <a href="/home">Home</a>
            <!-- <a href="/products" class="active">Products</a> -->
            <a href="/home#why-us">Why Us</a>
            <a href="/home#contact" class="nav-cta">Contact</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-container">
        <div class="content">
            <!-- Header -->
            <div class="header">
                <h1 class="header-title">Product Catalog</h1>
                <p class="header-subtitle">Browse our complete collection of imported goods</p>
            </div>

            <!-- Filters -->
            <div class="filters">
                <div class="search-box">
                    <span>🔍</span>
                    <input 
                        type="text" 
                        id="search" 
                        placeholder="Search products..."
                        onkeyup="filterProducts()"
                    >
                </div>
                <div class="filter-group">
                    <label class="filter-label">Min Price</label>
                    <input 
                        type="number" 
                        id="minPrice" 
                        class="filter-input" 
                        placeholder="$0"
                        onchange="filterProducts()"
                    >
                </div>
                <div class="filter-group">
                    <label class="filter-label">Max Price</label>
                    <input 
                        type="number" 
                        id="maxPrice" 
                        class="filter-input" 
                        placeholder="$9999"
                        onchange="filterProducts()"
                    >
                </div>
                <div class="filter-group">
                    <label class="filter-label">Stock</label>
                    <select id="stockFilter" class="filter-input" onchange="filterProducts()">
                        <option value="">All</option>
                        <option value="in">In Stock</option>
                        <option value="low">Low Stock</option>
                        <option value="out">Out of Stock</option>
                    </select>
                </div>
                <button class="btn-filter" onclick="filterProducts()">Apply</button>
                <button class="btn-reset" onclick="resetFilters()">Reset</button>
            </div>

            <!-- Products Section -->
            <div class="products-section">
                <div class="products-count" id="products-count">Loading...</div>
                <div class="products-grid" id="products-grid">
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                    <div class="skeleton-card"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p class="footer-text">© 2026 Global Import Solutions. All rights reserved. | <a href="/home" style="color: var(--primary); text-decoration: none;">Back to Home</a></p>
    </footer>

    <div class="toast" id="toast"></div>

    <script>
        const API_BASE = window.location.origin;
        let allProducts = [];

        // Load products on page load
        async function loadProducts() {
            try {
                const response = await fetch(`${API_BASE}/products/`);
                const data = await response.json();
                allProducts = data.products || [];
                renderProducts(allProducts);
                updateCount(allProducts.length);
            } catch (error) {
                console.error('Error loading products:', error);
                showEmpty('Failed to load products. Please try again.');
            }
        }

        // Render products
        function renderProducts(products) {
            const grid = document.getElementById('products-grid');
            
            if (products.length === 0) {
                showEmpty('No products found');
                return;
            }

            const emojis = {
                'Electronics': '📱',
                'Fashion': '👕',
                'Audio': '🎧',
                'Beauty': '💄',
                'Home': '🏠',
                'Sports': '⚽',
                'Furniture': '🛋️',
                'Stationery': '📝'
            };

            grid.innerHTML = products.map(p => {
                let stockBadge = '';
                if (p.quantity > 50) {
                    stockBadge = `<div class="product-stock-badge">In Stock (${p.quantity})</div>`;
                } else if (p.quantity > 0) {
                    stockBadge = `<div class="product-stock-badge low">Low Stock (${p.quantity})</div>`;
                } else {
                    stockBadge = `<div class="product-stock-badge out">Out of Stock</div>`;
                }

                return `
                    <div class="product-card">
                        <div class="product-image">
                            ${emojis[p.category] || '📦'}
                            ${stockBadge}
                        </div>
                        <div class="product-badge">${p.category || 'Product'}</div>
                        <div class="product-content">
                            <div class="product-category">${p.category || 'PRODUCTS'}</div>
                            <div class="product-name">${p.name}</div>
                            <div class="product-desc">${p.description || 'Quality imported product'}</div>
                            <div class="product-footer">
                                <div class="product-price">$${p.price?.toFixed(2)}</div>
                                <div class="product-quantity"><b>${p.quantity}</b> units</div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Filter products
        function filterProducts() {
            const search = document.getElementById('search').value.toLowerCase();
            const minPrice = parseFloat(document.getElementById('minPrice').value) || 0;
            const maxPrice = parseFloat(document.getElementById('maxPrice').value) || 9999;
            const stockFilter = document.getElementById('stockFilter').value;

            const filtered = allProducts.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(search) || 
                                    (p.description && p.description.toLowerCase().includes(search));
                const matchesPrice = p.price >= minPrice && p.price <= maxPrice;
                let matchesStock = true;

                if (stockFilter === 'in') matchesStock = p.quantity > 50;
                else if (stockFilter === 'low') matchesStock = p.quantity > 0 && p.quantity <= 50;
                else if (stockFilter === 'out') matchesStock = p.quantity === 0;

                return matchesSearch && matchesPrice && matchesStock;
            });

            renderProducts(filtered);
            updateCount(filtered.length);
        }

        // Reset filters
        function resetFilters() {
            document.getElementById('search').value = '';
            document.getElementById('minPrice').value = '';
            document.getElementById('maxPrice').value = '';
            document.getElementById('stockFilter').value = '';
            renderProducts(allProducts);
            updateCount(allProducts.length);
            showToast('Filters reset');
        }

        // Update product count
        function updateCount(count) {
            document.getElementById('products-count').textContent = 
                `Showing ${count} product${count !== 1 ? 's' : ''}`;
        }

        // Show empty state
        function showEmpty(message) {
            document.getElementById('products-grid').innerHTML = `
                <div class="empty-state">
                    <div class="empty-state-icon">📦</div>
                    <div class="empty-state-title">No Products</div>
                    <div class="empty-state-text">${message}</div>
                </div>
            `;
            updateCount(0);
        }

        // Show toast notification
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        // Load products on page load
        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
